name: CI
on:
  push:
  pull_request:
  # schedule:
  #     - cron: '0 0 * * *' # Once per day at midnight
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine
    - name: Build
      run: |
        python setup.py sdist bdist_wheel

  # Supported Python versions are the "Programming Language :: Python :: 3.N"
  # classifiers in setup.py. "3.x" (newest release) is always tested on top.
  python-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
    - uses: actions/checkout@v3
    - id: read
      run: |
        versions=$(grep -oE 'Programming Language :: Python :: 3\.[0-9]+' setup.py | grep -oE '3\.[0-9]+$')
        [ -n "$versions" ] || { echo "No Python classifiers found in setup.py"; exit 1; }
        echo "matrix=$( (echo "$versions"; echo 3.x) | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  test:
    needs: python-versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f test_requirements.txt ]; then pip install -r test_requirements.txt; fi
        if [ -f docs_requirements.txt ]; then pip install -r docs_requirements.txt; fi
    - name: Install test runner
      run: python -m pip install tox
    - name: Run tests
      run: tox -e py
  lint:
    needs: python-versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f test_requirements.txt ]; then pip install -r test_requirements.txt; fi
        if [ -f docs_requirements.txt ]; then pip install -r docs_requirements.txt; fi
    - name: Lint with flake8
      run: |
        flake8 .
  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.x"]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f test_requirements.txt ]; then pip install -r test_requirements.txt; fi
        if [ -f docs_requirements.txt ]; then pip install -r docs_requirements.txt; fi
    - name: Install make
      run: |
        sudo apt-get install build-essential
    - name: Make docs
      run: |
        cd docs && make html
